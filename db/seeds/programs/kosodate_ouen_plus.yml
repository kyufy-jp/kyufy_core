    - title: 子育て応援＋（プラス）対象者
      url: https://www.fukushi.metro.tokyo.lg.jp/kodomo/kosodate/018
      fetched_at: 2026-07-20
      body: |
        物価高などで実質賃金を圧迫する状況が続く中、子育て世帯を応援するため、東京アプリ生活応援事業の支援対象外である0歳から14歳の子供に対し、1人当たり11,000円を1回支給します。
        ●対象者：令和8年2月2日～令和9年4月1日の期間内で、0歳から14歳までの都民（生年月日が平成24年4月2日から令和9年4月1日までの間にある者）。ただし、対象期間内に15歳を迎える都民を除く（東京アプリ生活応援事業の支援対象外の都民）。
        ※上記期間中に出生した方、都内に転入した方、都外へ転出した方も対象となります。
