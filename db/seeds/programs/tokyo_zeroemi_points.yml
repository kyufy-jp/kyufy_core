      body: |
        「家庭のゼロエミッション行動推進事業」とは、設置済みのエアコン・冷蔵庫・給湯器・LED照明器具を除く照明器具を、省エネ性能の高いエアコン・冷蔵庫・給湯器・LED照明器具に買替えた都民に対して、東京ゼロエミポイント相当分を付与する、東京都が実施する事業です。
        東京ゼロエミポイントと、都の同種の助成金等は併用できません。
        助成金の申請は本事業に登録した事業者（販売店）が行います。個人の方は申請できませんのでご注意ください。
        対象となる方（申請には条件があります）：
        条件1 購入店舗：事前に登録された事業者（店舗）にて購入する方。
        条件2 購入者・住所：都内に住所を有する個人であって、その住所を公的な書類（免許証等）で証明できる方。
        条件3 買い替え：住宅に設置済みのエアコン、冷蔵庫、給湯器、照明器具を、省エネルギー性能の高い新品の対象家電等に買替えた方。※一部、新規購入も対象
        条件4 設置場所：購入した対象家電等を都内の住宅に設置する方。
        ポイント交付の対象となる販売期間：令和6年10月1日〜令和9年（2027年）3月31日まで（★3以上エアコンの高齢者・障害者向けは令和7年8月30日〜）。
  requirements:
