      body: |
        018（ゼロイチハチ）サポート（令和8年度も引き続き実施しています）。都内に在住する18歳以下の子供に対し、一人当たり月額5,000円（年額最大6万円）を支給します。
        対象者について（令和8年度分の申請）：以下のいずれにも該当する子供が対象です。所得制限はありません。
        1. 0歳から18歳に達する日以後の最初の3月31日までの間にある方
        2. 令和8年度中に都内に住所を有する又は有していた方（原則）
        ※各月1日時点の在住状況を確認します。
  requirements:
