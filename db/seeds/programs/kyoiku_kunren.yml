      fetched_at: 2026-07-20
      # 厚労省コンテンツは「公共データ利用規約（第1.0版）」(PDL1.0) に準拠。
      # 出典: https://www.mhlw.go.jp/chosakuken/ （※機構横断の著作権表示。hellowork自体の規約はサービス利用規約）。
      license: PDL1.0
      body: |
        一般教育訓練給付金は、雇用の安定と再就職の促進を支援するため、一定の条件を満たす雇用保険の被保険者または被保険者であった方（離職者）が、厚生労働大臣の指定する一般教育訓練を受講し、修了した場合は、受講者が支払った教育訓練経費の20％（上限10万円）をハローワークから支給します。
        （支給対象者）
        (1) 雇用保険の一般被保険者・高年齢被保険者等：一般教育訓練の受講開始日に、雇用保険に加入していた期間が3年以上
        (2) 雇用保険の一般被保険者・高年齢被保険者等であった方：雇用保険の資格を喪失した日（離職日の翌日）以降、受講開始日までが1年以内であり、かつ、雇用保険に加入していた期間が3年以上
  requirements:
    - kind: employment
      operator: eq
      value:
        eq: employee
        note: 雇用保険被保険者（=被雇用者）を要件とする。self_employed は 非該当。被保険者期間3年以上（初回は1年以上）は Profile に項目がなく未モデル化。
      raw_text: 雇用保険の被保険者または被保険者であった方（離職者）
      document_ref: 0
