  target: individual
  official_url: https://www.fukushi.metro.tokyo.lg.jp/kyufu/bukka-shien
  valid_from: 2025-04-01
  valid_until: 2027-03-31
  status: active
  source_documents:
    - title: 東京都子育て世帯物価高騰支援給付金支給要綱
      url: https://www.fukushi.metro.tokyo.lg.jp/kyufu/bukka-shien/youkou
      fetched_at: 2026-04-01
      body: |
        第1条 この要綱は、物価高騰の影響を受ける子育て世帯の生活を支援するため、
        東京都子育て世帯物価高騰支援給付金（以下「給付金」という。）の支給に関し
        必要な事項を定めるものとする。
        第3条 給付金の支給対象者は、申請日時点で満18歳以上であり、かつ前年の所得が
        256万円以下である者とする。
        第4条 給付金の額は、対象者一人につき30,000円とする。
