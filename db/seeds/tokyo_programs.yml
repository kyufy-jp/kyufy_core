# Seed data (§11): a small, realistic multi-program set loaded via ManualYamlAdapter -> Importer.
# Primary demo Profile is a Tokyo 23-ward resident (新宿区); one Saitama program lets the demo
# switch residence to さいたま市中央区 and show cross-municipality generality in one interaction.
#
# For the demo Profile { age: 52, residence: "新宿区", household_size: 3,
#   prior_year_income_jpy: 864_000, employment: "self_employed", target: "individual" } this set
# yields the full spread of verdicts:
#   国 定額減税            -> 該当   (national, always applies)
#   東京都 給付金          -> 該当   (prefecture 13 matches)
#   新宿区 高齢者助成      -> 非該当 (age 52 < 65)
#   新宿区 就学援助        -> 要確認 (a requirement the Profile can't determine)
#   さいたま市 給付金      -> excluded (different prefecture; appears if residence -> さいたま市…)
#
# NOTE: illustrative content for the MVP demo — NOT an authoritative reproduction of any real
# program's 要綱. Confirm details at each official window.

- name: 定額減税（所得税・個人住民税）
  authority: 国税庁
  jurisdiction: national
  prefecture_code: null
  municipality_code: null
  category: 控除
  target: individual
  official_url: https://www.nta.go.jp/teigakugenzei
  valid_from: 2024-06-01
  valid_until: 2027-03-31
  status: active
  source_documents:
    - title: 定額減税の概要
      url: https://www.nta.go.jp/teigakugenzei/gaiyo
      fetched_at: 2026-04-01
      body: |
        令和6年分の所得税及び個人住民税について、定額による特別税額控除（定額減税）が
        実施される。対象は、前年の合計所得金額が1,805万円以下である居住者とする。
  requirements:
    - kind: income
      operator: lte
      value:
        threshold: 18050000
      raw_text: 前年の合計所得金額が1,805万円以下である居住者であること。
      document_ref: 0

